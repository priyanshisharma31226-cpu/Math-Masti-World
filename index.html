
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7548e8">
<title>Math Masti World</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Trebuchet MS',Arial,sans-serif;color:#35265d}
#app{min-height:100vh;background:linear-gradient(135deg,#ffd9ec,#d9d5ff,#c7f4ff);transition:background .5s}
.screen{max-width:650px;margin:auto;min-height:100vh;padding:18px 16px 35px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:900;color:#6038ae}
.pill{background:white;padding:9px 14px;border-radius:30px;font-weight:bold;box-shadow:0 4px 0 #d6c7f2}
button{border:0;cursor:pointer;font-family:inherit}
.hero{text-align:center;padding:20px 0}
.mascot{font-size:75px}
.hero h1{font-size:clamp(36px,10vw,55px);margin:5px;color:#7042c6;text-shadow:3px 3px white}
.hero p{font-size:17px;font-weight:bold;color:#76629b}
.heading{text-align:center;font-size:22px;font-weight:900;margin:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.game{
 height:115px;border-radius:27px;color:white;font-size:21px;font-weight:900;
 box-shadow:0 7px 0 #55408038;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:5px
}
.game span{font-size:37px}
.game:active,.start:active,.next:active{transform:translateY(4px)}
.purple{background:linear-gradient(140deg,#b18aff,#7044df)}
.pink{background:linear-gradient(140deg,#ff9ec9,#ed4c91)}
.blue{background:linear-gradient(140deg,#6bdcff,#3688e9)}
.orange{background:linear-gradient(140deg,#ffc46f,#ff8045)}
.green{background:linear-gradient(140deg,#7ee8b0,#21ad7a)}
.yellow{background:linear-gradient(140deg,#ffe77d,#f2b42b)}
.card{background:#ffffffdf;border:3px solid white;border-radius:28px;padding:17px;margin-top:18px;box-shadow:0 8px 20px #7053a522}
.card h3{text-align:center;margin:0 0 12px}
.levels{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.level{padding:10px 17px;border-radius:20px;background:#eee6ff;color:#6745b2;font-weight:bold}
.level.active{background:#7548e8;color:white}
.start,.next{width:100%;margin-top:18px;padding:15px;border-radius:25px;color:white;font-size:22px;font-weight:900;background:linear-gradient(100deg,#ff80b5,#ff9d50);box-shadow:0 7px 0 #dc568b}
.footer{text-align:center;margin-top:20px;font-weight:bold;color:#786a9c}

/* Quiz */
#quizScreen,#resultScreen{display:none}
.quiztop{display:flex;justify-content:space-between;align-items:center;gap:7px}
.small{background:white;border-radius:25px;padding:9px 12px;font-weight:900;box-shadow:0 4px 0 #d8c9f0}
.progressbg{height:12px;background:#ffffffa8;border-radius:20px;margin:17px 0;overflow:hidden}
.progress{height:100%;width:10%;background:linear-gradient(90deg,#ff85b5,#ffca55);transition:width .4s}
.count{text-align:center;font-weight:900;color:#7655aa}
.questioncard{margin:18px 0 12px;padding:18px 10px;background:#ffffffdf;border:4px solid white;border-radius:30px;text-align:center;box-shadow:0 8px 0 #7960a522}
.qemoji{font-size:38px}
.questioncard h2{margin:5px;color:#7557aa}
.question{font-size:clamp(42px,12vw,65px);font-weight:1000;color:#5e35b1;overflow-wrap:anywhere}
.decor{text-align:center;font-size:26px;letter-spacing:7px;margin:12px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.option{height:110px;border:4px solid white;color:white;font-size:35px;font-weight:1000;box-shadow:0 7px 0 #55408035;text-shadow:0 2px 2px #0002}
.option:nth-child(1){background:linear-gradient(140deg,#ff9ec9,#e94a92);border-radius:28px 28px 28px 7px}
.option:nth-child(2){background:linear-gradient(140deg,#70dcff,#3489eb);border-radius:50%}
.option:nth-child(3){background:linear-gradient(140deg,#ffd071,#ff8647);border-radius:28px 7px 28px 28px}
.option:nth-child(4){background:linear-gradient(140deg,#84e9b4,#21ad7c);border-radius:28px}
.option.correct{background:linear-gradient(140deg,#6ce5a5,#17a96c)!important;border-color:#fff28a;transform:scale(1.04)}
.option.wrong{background:linear-gradient(140deg,#ff99a5,#df4560)!important;animation:shake .3s}
.option:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{text-align:center;min-height:43px;padding:9px 2px;font-size:19px;font-weight:900;color:#7048b2}
.next{background:linear-gradient(100deg,#8d6bef,#5b40cc);box-shadow:0 7px 0 #45309b}
.next:disabled{opacity:.45;cursor:not-allowed}

/* Result */
#resultScreen{text-align:center;padding-top:45px}
.trophy{font-size:100px}
.resultcard{background:#ffffffdf;border:4px solid white;border-radius:32px;padding:23px 12px;margin:17px 0;box-shadow:0 8px 0 #7960a522}
.resultcard h1{font-size:34px;color:#7044b6}
.score{font-size:68px;font-weight:1000;color:#f18b3c}
.stars{font-size:36px}
.resultmsg{font-size:20px;font-weight:bold;color:#735b9e}
.secondary{width:100%;padding:14px;border-radius:23px;background:white;color:#6744b3;font-size:19px;font-weight:900;margin-top:13px;box-shadow:0 5px 0 #d7c9ee}
@media(max-width:380px){.screen{padding:13px 12px}.option{height:95px}.options{gap:10px}}
</style>
</head>
<body>
<div id="app">
<main class="screen">

<section id="homeScreen">
 <div class="top">
  <div class="logo">🌈 Math Masti World</div>
  <button class="pill" onclick="toggleLanguage()" id="langBtn">हिंदी</button>
 </div>
 <div class="hero">
  <div class="mascot">🦄</div>
  <h1>Math Masti World!</h1>
  <p id="tagline">Learn Maths • Play Games • Have Fun!</p>
 </div>
 <div class="heading" id="chooseTitle">🎮 Choose Your Maths Game</div>
 <div class="grid">
  <button class="game purple" onclick="chooseGame('add')"><span>➕</span><label id="addLabel">Addition</label></button>
  <button class="game pink" onclick="chooseGame('sub')"><span>➖</span><label id="subLabel">Subtraction</label></button>
  <button class="game blue" onclick="chooseGame('mul')"><span>✖️</span><label id="mulLabel">Multiplication</label></button>
  <button class="game orange" onclick="chooseGame('div')"><span>➗</span><label id="divLabel">Division</label></button>
 </div>
 <div class="card">
  <h3 id="ageTitle">🧒 Choose Your Level</h3>
  <div class="levels">
   <button class="level active" onclick="setAge(5,this)">Age 5</button>
   <button class="level" onclick="setAge(6,this)">Age 6</button>
   <button class="level" onclick="setAge(7,this)">Age 7</button>
   <button class="level" onclick="setAge(8,this)">Age 8</button>
  </div>
  <button class="start" id="startBtn" onclick="startGame()">🚀 START PLAYING</button>
 </div>
 <div class="footer">⭐ Fun Learning For Everyone ⭐</div>
</section>

<section id="quizScreen">
 <div class="quiztop">
  <button class="small" onclick="goHome()">🏠 Home</button>
  <div class="small" id="scorePill">⭐ 0</div>
  <div class="small" id="agePill">Age 5</div>
 </div>
 <div class="progressbg"><div class="progress" id="progress"></div></div>
 <div class="count" id="questionCount">Question 1 of 10</div>
 <div class="questioncard">
  <div class="qemoji" id="qEmoji">🌟</div>
  <h2 id="questionLabel">Solve this!</h2>
  <div class="question" id="questionText">2 + 3 = ?</div>
 </div>
 <div class="decor" id="decor">🌈 ⭐ 🎈</div>
 <div class="options" id="options"></div>
 <div class="feedback" id="feedback">Choose the correct answer!</div>
 <button class="next" id="nextBtn" onclick="nextQuestion()" disabled>Next Question ➜</button>
</section>

<section id="resultScreen">
 <div class="trophy" id="trophy">🏆</div>
 <div class="resultcard">
  <h1 id="resultHeading">Amazing Job!</h1>
  <div class="score" id="finalScore">10/10</div>
  <div class="stars" id="finalStars">⭐⭐⭐⭐⭐</div>
  <div class="resultmsg" id="resultMessage">You are a Maths Superstar!</div>
 </div>
 <button class="start" onclick="startGame()">🔄 Play Again</button>
 <button class="secondary" onclick="goHome()">🏠 Back to Home</button>
 <button class="secondary" onclick="shareScore()">📤 Share My Score</button>
</section>

</main>
</div>

<script>
let lang='en',age=5,game='add',questions=[],current=0,score=0,answered=false;

const themes=[
 ['linear-gradient(135deg,#ffe0ef,#e4d5ff,#c9f6ff)','🌈','🌈 ⭐ 🎈'],
 ['linear-gradient(135deg,#fff0c9,#ffd7e8,#d9e9ff)','🦋','🦋 🌸 ✨'],
 ['linear-gradient(135deg,#c8f5ff,#d8d1ff,#ffe0ef)','🚀','🚀 🌟 ☁️'],
 ['linear-gradient(135deg,#e2ffd7,#fff0bd,#ffd9eb)','🐸','🍀 🌼 ⭐'],
 ['linear-gradient(135deg,#ffe1c5,#ffd7ec,#d7e8ff)','🦄','🦄 💖 ✨'],
 ['linear-gradient(135deg,#d9e4ff,#f9d9ff,#d1fff0)','🎈','🎈 🎉 ⭐'],
 ['linear-gradient(135deg,#fff2b8,#ffd9df,#d9eaff)','🐻','🐻 🍭 🌈'],
 ['linear-gradient(135deg,#d5fff0,#dce3ff,#ffe2f2)','🐬','🐬 💎 ⭐'],
 ['linear-gradient(135deg,#ffe0b8,#fbd9ff,#d8f7ff)','🦁','🦁 🌟 🎊'],
 ['linear-gradient(135deg,#e8d9ff,#d2faff,#fff0c9)','🎁','🎁 🎉 🌈']
];

const words={
 en:{
  tagline:'Learn Maths • Play Games • Have Fun!',
  choose:'🎮 Choose Your Maths Game',age:'🧒 Choose Your Level',
  add:'Addition',sub:'Subtraction',mul:'Multiplication',div:'Division',
  start:'🚀 START PLAYING',solve:'Solve this!',next:'Next Question ➜',
  chooseAnswer:'Choose the correct answer!',
  correct:['🎉 Fantastic! You got it!','⭐ Super Star! Correct!','🥳 Brilliant! Well done!','🚀 Amazing work!'],
  wrong:'😊 Good try! The correct answer is ',
  question:'Question',of:'of',result:'Amazing Job!',
  message:['Keep practising, Superstar!','Great work! You are improving!','Wonderful! You are a Maths Star!','WOW! You are a Maths Champion!']
 },
 hi:{
  tagline:'गणित सीखें • खेलें • मज़े करें!',
  choose:'🎮 अपना गणित का खेल चुनें',age:'🧒 अपना स्तर चुनें',
  add:'जोड़',sub:'घटाव',mul:'गुणा',div:'भाग',
  start:'🚀 खेल शुरू करें',solve:'हल कीजिए!',next:'अगला सवाल ➜',
  chooseAnswer:'सही उत्तर चुनिए!',
  correct:['🎉 बहुत बढ़िया! सही जवाब!','⭐ शानदार! शाबाश!','🥳 कमाल कर दिया!','🚀 गज़ब!'],
  wrong:'😊 अच्छी कोशिश! सही उत्तर है ',
  question:'सवाल',of:'में से',result:'शानदार प्रदर्शन!',
  message:['अभ्यास करते रहिए, चैंपियन!','बहुत अच्छा! आगे बढ़ते रहिए!','वाह! आप Maths Star हैं!','कमाल! आप Maths Champion हैं!']
 }
};

function toggleLanguage(){
 lang=lang==='en'?'hi':'en';
 let w=words[lang];
 document.getElementById('langBtn').textContent=lang==='en'?'हिंदी':'English';
 document.getElementById('tagline').textContent=w.tagline;
 document.getElementById('chooseTitle').textContent=w.choose;
 document.getElementById('ageTitle').textContent=w.age;
 document.getElementById('addLabel').textContent=w.add;
 document.getElementById('subLabel').textContent=w.sub;
 document.getElementById('mulLabel').textContent=w.mul;
 document.getElementById('divLabel').textContent=w.div;
 document.getElementById('startBtn').textContent=w.start;
 if(document.getElementById('quizScreen').style.display==='block'){
  document.getElementById('questionLabel').textContent=w.solve;
  document.getElementById('nextBtn').textContent=current===9?(lang==='hi'?'परिणाम देखें 🏆':'See Result 🏆'):w.next;
  if(!answered)document.getElementById('feedback').textContent=w.chooseAnswer;
  document.getElementById('questionCount').textContent=w.question+' '+(current+1)+' '+w.of+' 10';
 }
}

function chooseGame(g){
 game=g;
 document.querySelectorAll('.game').forEach(b=>b.style.outline='none');
 event.currentTarget.style.outline='4px solid white';
}
function setAge(n,btn){
 age=n;
 document.querySelectorAll('.level').forEach(x=>x.classList.remove('active'));
 btn.classList.add('active');
}
function rand(n){return Math.floor(Math.random()*n)}
function makeQuestion(){
 let a,b,answer,op;
 const max=age===5?10:age===6?20:age===7?50:100;
 if(game==='add'){a=rand(max)+1;b=rand(max)+1;answer=a+b;op='+'}
 else if(game==='sub'){a=rand(max)+1;b=rand(a)+1;answer=a-b;op='−'}
 else if(game==='mul'){
  let limit=age===5?5:age===6?6:age===7?10:12;
  a=rand(limit)+1;b=rand(limit)+1;answer=a*b;op='×'
 }else{
  b=rand(age===5?4:age===6?6:age===7?10:12)+1;
  answer=rand(age===5?5:age===6?8:age===7?10:12)+1;
  a=b*answer;op='÷'
 }
 return {a,b,answer,op};
}
function buildQuestions(){
 questions=[];
 for(let i=0;i<10;i++){
  let q=makeQuestion(),opts=new Set([q.answer]);
  while(opts.size<4){
   let delta=rand(9)+1;
   let v=Math.random()<.5?q.answer+delta:q.answer-delta;
   if(v>=0 && v!==q.answer)opts.add(v);
  }
  questions.push({...q,options:[...opts].sort(()=>Math.random()-.5)});
 }
}
function startGame(){
 buildQuestions();current=0;score=0;
 document.getElementById('homeScreen').style.display='none';
 document.getElementById('resultScreen').style.display='none';
 document.getElementById('quizScreen').style.display='block';
 showQuestion();window.scrollTo(0,0);
}
function showQuestion(){
 answered=false;
 let q=questions[current],t=themes[current%themes.length],w=words[lang];
 document.getElementById('app').style.background=t[0];
 document.getElementById('qEmoji').textContent=t[1];
 document.getElementById('decor').textContent=t[2];
 document.getElementById('questionText').textContent=q.a+' '+q.op+' '+q.b+' = ?';
 document.getElementById('questionLabel').textContent=w.solve;
 document.getElementById('questionCount').textContent=w.question+' '+(current+1)+' '+w.of+' 10';
 document.getElementById('scorePill').textContent='⭐ '+score;
 document.getElementById('agePill').textContent='Age '+age;
 document.getElementById('progress').style.width=((current+1)*10)+'%';
 document.getElementById('feedback').textContent=w.chooseAnswer;
 document.getElementById('nextBtn').disabled=true;
 document.getElementById('nextBtn').textContent=current===9?(lang==='hi'?'परिणाम देखें 🏆':'See Result 🏆'):w.next;
 let container=document.getElementById('options');
 container.innerHTML='';
 q.options.forEach(v=>{
  let btn=document.createElement('button');
  btn.className='option';btn.textContent=v;
  btn.onclick=()=>checkAnswer(v,btn);
  container.appendChild(btn);
 });
}
function checkAnswer(value,btn){
 if(answered)return;
 answered=true;
 let q=questions[current],w=words[lang];
 document.querySelectorAll('.option').forEach(b=>{
  b.disabled=true;
  if(Number(b.textContent)===q.answer)b.classList.add('correct');
 });
 if(value===q.answer){
  score++;
  document.getElementById('feedback').textContent=w.correct[rand(w.correct.length)];
 }else{
  btn.classList.add('wrong');
  document.getElementById('feedback').textContent=w.wrong+q.answer;
 }
 document.getElementById('scorePill').textContent='⭐ '+score;
 document.getElementById('nextBtn').disabled=false;
}
function nextQuestion(){
 if(!answered)return;
 if(current<9){current++;showQuestion()}
 else showResult();
 window.scrollTo(0,0);
}
function showResult(){
 document.getElementById('quizScreen').style.display='none';
 document.getElementById('resultScreen').style.display='block';
 document.getElementById('app').style.background='linear-gradient(135deg,#fff0a8,#ffd6eb,#d6e7ff)';
 document.getElementById('finalScore').textContent=score+'/10';
 document.getElementById('resultHeading').textContent=words[lang].result;
 document.getElementById('resultMessage').textContent=words[lang].message[score>=9?3:score>=7?2:score>=4?1:0];
 document.getElementById('finalStars').textContent='⭐'.repeat(Math.max(1,Math.ceil(score/2)));
 document.getElementById('trophy').textContent=score>=8?'🏆':score>=5?'🥇':'🌟';
 window.scrollTo(0,0);
}
function goHome(){
 document.getElementById('quizScreen').style.display='none';
 document.getElementById('resultScreen').style.display='none';
 document.getElementById('homeScreen').style.display='block';
 document.getElementById('app').style.background='linear-gradient(135deg,#ffd9ec,#d9d5ff,#c7f4ff)';
 window.scrollTo(0,0);
}
function shareScore(){
 let msg='🌈 Math Masti World 🌈\nI scored '+score+'/10 in Maths!\nCan you beat my score?';
 if(navigator.share)navigator.share({title:'Math Masti World',text:msg}).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(msg).then(()=>alert('Score copied!'));
 else prompt('Copy your score:',msg);
}
</script>
</body>
</html>
